# Nginx config for SPA hosting
# Listens on 8080 (non-privileged port, works in restricted container runtimes)

server {
    listen       8080 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Security headers
    add_header X-Frame-Options          "SAMEORIGIN"          always;
    add_header X-Content-Type-Options   "nosniff"             always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(self)" always;

    # Cache static assets aggressively
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML: never cache (SPA shell)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Health endpoint for k8s / LB probes
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Deny dotfiles / source maps in prod
    location ~ /\. {
        deny all;
        access_log off;
    }
}
